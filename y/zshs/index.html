<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>💎钻石回收💎</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1b2b27;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 25px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1600px;
            width: 100%;
            flex: 1 0 auto;
        }

        h1 {
            color: #fad57e;
            text-shadow: 0 3px 0 #725f36;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .sub {
            color: #b0cfb1;
            text-align: center;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 0 10px;
        }

        /* 双栏布局 */
        .double-col {
            display: flex;
            gap: 28px;
            align-items: stretch;
            flex-wrap: wrap;
            width: 100%;
        }

        /* 左侧面板 */
        .left-panel {
            flex: 1 1 460px;
            min-width: 300px;
            background: #1d372f;
            border-radius: 30px;
            border: 1px solid #5b8a74;
            padding: 25px 20px;
            box-shadow: 0 15px 20px -10px #0d1f1a;
        }

        /* 右侧面板 */
        .right-panel {
            flex: 2 1 500px;
            min-width: 300px;
            background: #1a332c;
            border-radius: 30px;
            border: 1px solid #618b74;
            padding: 25px 20px;
            box-shadow: 0 15px 20px -10px #0d1f1a;
            display: flex;
            flex-direction: column;
        }

        /* 小屏幕优化 */
        @media screen and (max-width: 768px) {
            .double-col {
                gap: 20px;
            }
            .left-panel, .right-panel {
                padding: 20px 15px;
                border-radius: 25px;
            }
            body {
                padding: 15px 10px;
            }
        }

        .left-panel h2, .right-panel h2 {
            color: #ffd98c;
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin-bottom: 20px;
            border-left: 8px solid #b98f4a;
            padding-left: 20px;
            word-break: break-word;
        }

        /* 装备图库 */
        .preview-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #244137;
            border-radius: 30px;
            padding: 20px 15px;
            border: 1px solid #608a73;
            width: 100%;
        }

        .preview-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1f3a30;
            border-radius: 25px;
            padding: 8px 15px;
            border: 1px solid #5e8e72;
            flex-wrap: wrap;
            width: 100%;
        }

        .preview-level-badge {
            min-width: 50px;
            background: #3a604e;
            color: #fbeba7;
            border-radius: 30px;
            padding: 6px 0;
            font-weight: 700;
            font-size: clamp(1rem, 4vw, 1.3rem);
            text-align: center;
            border: 1px solid #9ebe8e;
            box-shadow: inset 0 2px 5px #2b4d38;
        }

        .preview-icons-row {
            display: flex;
            flex: 1;
            gap: clamp(10px, 2vw, 20px);
            justify-content: flex-start;
            flex-wrap: wrap;
        }

        .preview-icon {
            width: clamp(60px, 12vw, 75px);
            background: #2d4f3e;
            border-radius: 16px;
            border: 2px solid #5d8d72;
            padding: 5px 0 2px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-icon .mini-img {
            width: clamp(40px, 8vw, 52px);
            height: clamp(40px, 8vw, 52px);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #345f46;
            border-radius: 12px;
            border: 1px solid #86b692;
        }

        .preview-icon .mini-label {
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            background: #1e3d2e;
            color: #eddba5;
            width: 100%;
            text-align: center;
            border-radius: 0 0 14px 14px;
            font-weight: 600;
            padding: 3px 0;
        }

        /* 右侧卡片 */
        .server-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            overflow-y: auto;
            max-height: 700px;
            padding-right: 8px;
            width: 100%;
        }

        .server-card {
            background: #25473b;
            border-radius: 30px;
            border: 2px solid #b87e3e;
            padding: 18px 18px;
            box-shadow: 0 8px 0 #1b352b;
            width: 100%;
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #b87e3e;
            padding-bottom: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .server-name {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: 700;
            color: #fbdd9d;
            word-break: break-word;
        }

        .missing-badge {
            background: #b9523a;
            color: #fbeac3;
            border-radius: 30px;
            padding: 4px 15px;
            font-weight: 600;
            border: 1px solid #ffad6b;
            white-space: nowrap;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }

        /* 等级块容器 */
        .missing-levels-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-start;
        }

        /* 单个等级块 */
        .missing-level-block {
            background: #2d4f3e;
            border-radius: 25px;
            padding: 10px 10px 8px 10px;
            border: 1px solid #7aa982;
            min-width: 100px;
            flex: 0 1 auto;
        }

        .missing-level-block .level-title-compact {
            text-align: center;
            background: #5f4a2b;
            color: #ffeaa2;
            font-weight: 700;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            padding: 4px 0;
            border-radius: 20px;
            margin-bottom: 8px;
            border: 1px solid #e2b86b;
        }

        .missing-equip-compact {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .missing-equip-item {
            width: clamp(55px, 10vw, 65px);
            background: #654728;
            border-radius: 16px;
            border: 2px solid #d7943a;
            padding: 3px 0 2px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .missing-equip-item .equip-img {
            width: clamp(36px, 7vw, 42px);
            height: clamp(36px, 7vw, 42px);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #4f3f28;
            border-radius: 12px;
            border: 1px solid #efb060;
        }

        .missing-equip-item .equip-label {
            width: 100%;
            text-align: center;
            background: #a8682b;
            color: #211500;
            font-size: clamp(0.7rem, 2vw, 0.75rem);
            padding: 2px 0;
            border-radius: 0 0 12px 12px;
            font-weight: 600;
        }

        .empty-note {
            color: #afcaad;
            text-align: center;
            padding: 30px;
            font-size: 1.2rem;
        }

        /* 数据编辑区域 */
        .data-editor {
            margin: 40px 0 30px;
            background: #1d372f;
            border-radius: 30px;
            padding: 25px;
            border: 1px solid #b87e3e;
            color: #e6dbb2;
        }

        .data-editor h3 {
            color: #f7cf89;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            margin-bottom: 15px;
        }

        .data-editor textarea {
            width: 100%;
            background: #0f2a22;
            border: 1px solid #c9af6b;
            color: #ffd966;
            padding: 15px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .data-editor textarea:focus {
            border-color: #f3b35e;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: #5f884a;
            border: none;
            border-radius: 40px;
            padding: 12px 25px;
            font-weight: 600;
            color: #fbefc7;
            border: 1px solid #97ba8c;
            cursor: pointer;
            box-shadow: 0 4px 0 #1f3a30;
            transition: 0.1s;
            font-size: 1rem;
        }

        .btn:hover {
            background: #72a259;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1f3a30;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1f3a30;
        }

        .btn-warning {
            background: #8f623b;
            border-color: #ebbc7e;
        }

        .btn-warning:hover {
            background: #a57a4c;
        }

        .format-guide {
            margin-top: 15px;
            background: #0f2a22;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .format-guide p {
            margin-bottom: 8px;
        }

        .format-guide code {
            background: #1d372f;
            padding: 2px 6px;
            border-radius: 12px;
            color: #ffd966;
            border: 1px solid #a58e4a;
        }

        .footer-note {
            margin: 30px 0;
            color: #689177;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💎 钻石回收 · 装备缺失管理</h1>
    <div class="sub">
        <span>武器·衣服·镯·指 43~49级</span>
        <span>左侧图库 · 右侧各区服缺失</span>
    </div>

    <div class="double-col">
        <!-- 左侧面板：装备图库 -->
        <div class="left-panel">
            <h2>📋 装备图库</h2>
            <div class="preview-grid" id="previewGrid"></div>
        </div>

        <!-- 右侧面板：区服缺失装备 -->
        <div class="right-panel">
            <h2>📦 各区服缺失装备</h2>
            <div class="server-cards" id="serverCardsContainer"></div>
        </div>
    </div>

    <!-- 数据编辑区域 -->
    <div class="data-editor">
        <h3>📝 编辑区服缺失数据</h3>
        <textarea id="dataInput" rows="8" placeholder="每行一个区服，格式：区服名称+装备1、装备2、装备3">131区·战神+43镯、45衣服、46武器、49衣服
S2·虎啸+43武器、43衣服、44镯、45指、47武器、48衣服、49镯
S3·凤凰+45武器、45衣服、46镯、46指、48镯、49指、43镯</textarea>
        <div class="btn-group">
            <button class="btn" id="updateBtn">🔄 更新显示</button>
            <button class="btn btn-warning" id="resetBtn">↩️ 重置示例</button>
            <button class="btn" id="clearBtn">🗑️ 清空所有</button>
        </div>
        
        <div class="format-guide">
            <p><strong>格式说明：</strong></p>
            <p>• 每行格式：<code>区服名称+装备1、装备2、装备3</code></p>
            <p>• 多个装备用中文逗号、顿号或空格分隔</p>
            <p>• 每个装备格式：<code>等级+部位</code>（如：43镯、45衣服、46武器、49衣服）</p>
            <p>• 部位可用：武/武器、衣/衣服、镯、指</p>
        </div>
    </div>

    <div class="footer-note">
        ⚡ 在上方编辑框中修改数据，点击"更新显示"即可看到变化
    </div>
</div>

<script>
(function() {
    // 装备图片映射
    const EQUIP_IMG_MAP = {
        "43": { "wq": "43_wq.png", "jia": "43_jia.png", "zhuo": "43_zhuo.png", "zhi": "43_zhi.png" },
        "44": { "wq": "44_wq.png", "jia": "44_jia.png", "zhuo": "44_zhuo.png", "zhi": "44_zhi.png" },
        "45": { "wq": "45_wq.png", "jia": "45_jia.png", "zhuo": "45_zhuo.png", "zhi": "45_zhi.png" },
        "46": { "wq": "46_wq.png", "jia": "46_jia.png", "zhuo": "46_zhuo.png", "zhi": "46_zhi.png" },
        "47": { "wq": "47_wq.png", "jia": "47_jia.png", "zhuo": "47_zhuo.png", "zhi": "47_zhi.png" },
        "48": { "wq": "48_wq.png", "jia": "48_jia.png", "zhuo": "48_zhuo.png", "zhi": "48_zhi.png" },
        "49": { "wq": "49_wq.png", "jia": "49_jia.png", "zhuo": "49_zhuo.png", "zhi": "49_zhi.png" }
    };

    // 等级和部位
    const LEVELS = [43, 44, 45, 46, 47, 48, 49];
    const TYPES = [
        { key: 'wq', label: '武' },
        { key: 'jia', label: '衣' },
        { key: 'zhuo', label: '镯' },
        { key: 'zhi', label: '指' }
    ];

    // 默认示例数据
    const DEFAULT_DATA = `131区·战神+43镯、45衣服、46武器、49衣服`;

    // ---------- 解析文本数据 ----------
    function parseData(text) {
        const lines = text.split('\n');
        const serverData = [];

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            // 解析格式：区服+装备
            if (line.includes('+')) {
                const [serverName, itemsStr] = line.split('+').map(s => s.trim());
                if (!serverName || !itemsStr) return;

                // 解析装备项
                const items = itemsStr.split(/[、，\s]+/).filter(item => item.trim());
                const missing = [];

                items.forEach(item => {
                    // 匹配数字+中文部位
                    const match = item.match(/(\d+)([镯指衣武器武])/);
                    if (match) {
                        const level = match[1];
                        const partChar = match[2];
                        
                        // 转换部位
                        const partMap = {
                            '武': 'wq', '武器': 'wq',
                            '衣': 'jia', '衣服': 'jia',
                            '镯': 'zhuo',
                            '指': 'zhi'
                        };
                        
                        if (partMap[partChar]) {
                            missing.push(level + '_' + partMap[partChar]);
                        }
                    }
                });

                if (missing.length > 0) {
                    serverData.push({
                        server: serverName,
                        missing: missing
                    });
                }
            }
        });

        return serverData;
    }

    // ---------- 渲染左侧装备图库 ----------
    function renderPreviewGrid() {
        const grid = document.getElementById('previewGrid');
        if (!grid) return;
        
        grid.innerHTML = '';
        
        LEVELS.forEach(level => {
            const levelStr = level.toString();
            const levelData = EQUIP_IMG_MAP[levelStr] || {};
            
            const row = document.createElement('div');
            row.className = 'preview-row';
            
            // 等级徽章
            const badge = document.createElement('div');
            badge.className = 'preview-level-badge';
            badge.textContent = level;
            row.appendChild(badge);
            
            // 图标行
            const iconsRow = document.createElement('div');
            iconsRow.className = 'preview-icons-row';
            
            TYPES.forEach(type => {
                const imgFile = levelData[type.key] || '';
                const item = document.createElement('div');
                item.className = 'preview-icon';
                
                const imgDiv = document.createElement('div');
                imgDiv.className = 'mini-img';
                if (imgFile) {
                    imgDiv.style.backgroundImage = `url('${imgFile}')`;
                } else {
                    imgDiv.style.backgroundColor = '#2d4f3e';
                }
                
                const label = document.createElement('div');
                label.className = 'mini-label';
                label.textContent = type.label;
                
                item.appendChild(imgDiv);
                item.appendChild(label);
                iconsRow.appendChild(item);
            });
            
            row.appendChild(iconsRow);
            grid.appendChild(row);
        });
    }

    // ---------- 渲染右侧卡片 ----------
    function renderServerCards(serverData) {
        const container = document.getElementById('serverCardsContainer');
        if (!container) return;
        
        if (!serverData || serverData.length === 0) {
            container.innerHTML = '<div class="empty-note">✨ 暂无缺失数据，请在下方添加</div>';
            return;
        }
        
        let html = '';
        
        serverData.forEach(section => {
            const serverName = section.server;
            const missingList = section.missing || [];
            if (missingList.length === 0) return;
            
            // 按等级分组
            const missingByLevel = {};
            missingList.forEach(key => {
                const [level, part] = key.split('_');
                if (!missingByLevel[level]) {
                    missingByLevel[level] = [];
                }
                missingByLevel[level].push(part);
            });
            
            // 排序等级
            const sortedLevels = Object.keys(missingByLevel).sort((a, b) => parseInt(a) - parseInt(b));
            
            let levelsHtml = '';
            sortedLevels.forEach(level => {
                const parts = missingByLevel[level].sort();
                
                let partsHtml = '';
                parts.forEach(part => {
                    const imgFile = EQUIP_IMG_MAP[level] ? EQUIP_IMG_MAP[level][part] : '';
                    const typeObj = TYPES.find(t => t.key === part);
                    const typeLabel = typeObj ? typeObj.label : part;
                    
                    partsHtml += `
                        <div class="missing-equip-item">
                            <div class="equip-img" style="background-image: url('${imgFile}');"></div>
                            <div class="equip-label">${typeLabel}</div>
                        </div>
                    `;
                });
                
                levelsHtml += `
                    <div class="missing-level-block">
                        <div class="level-title-compact">${level}级</div>
                        <div class="missing-equip-compact">
                            ${partsHtml}
                        </div>
                    </div>
                `;
            });
            
            html += `
                <div class="server-card">
                    <div class="server-header">
                        <span class="server-name">${escapeHtml(serverName)}</span>
                        <span class="missing-badge">缺失 ${missingList.length}</span>
                    </div>
                    <div class="missing-levels-container">
                        ${levelsHtml}
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html || '<div class="empty-note">✨ 暂无缺失数据，请在下方添加</div>';
    }

    // HTML转义
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ---------- 更新数据 ----------
    function updateData() {
        const input = document.getElementById('dataInput').value;
        const serverData = parseData(input);
        renderServerCards(serverData);
    }

    // ---------- 重置为默认数据 ----------
    function resetData() {
        document.getElementById('dataInput').value = DEFAULT_DATA;
        updateData();
    }

    // ---------- 清空所有数据 ----------
    function clearData() {
        document.getElementById('dataInput').value = '';
        renderServerCards([]);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        renderPreviewGrid();
        document.getElementById('dataInput').value = DEFAULT_DATA;
        updateData();
        
        document.getElementById('updateBtn').addEventListener('click', updateData);
        document.getElementById('resetBtn').addEventListener('click', resetData);
        document.getElementById('clearBtn').addEventListener('click', clearData);
    });

})();
</script>
</body>
</html>
