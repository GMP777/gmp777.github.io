<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>💎钻石回收💎</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1b2b27;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 25px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1600px;
            width: 100%;
            flex: 1 0 auto;
        }
        h1 {
            color: #fad57e;
            text-shadow: 0 3px 0 #725f36;
            font-size: 2.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .sub {
            color: #b0cfb1;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 0 10px;
        }
        /* 双栏布局 - 增强自适应 */
        .double-col {
            display: flex;
            gap: 28px;
            align-items: stretch;
            flex-wrap: wrap;
        }
        /* 左侧面板：装备预览+录入 */
        .left-panel {
            flex: 1.1;
            min-width: 460px;
            background: #1d372f;
            border-radius: 50px;
            border: 1px solid #5b8a74;
            padding: 28px 22px;
            box-shadow: 0 15px 20px -10px #0d1f1a;
            transition: all 0.2s;
        }
        /* 右侧面板：区服卡片 */
        .right-panel {
            flex: 2;
            min-width: 500px;
            background: #1a332c;
            border-radius: 60px;
            border: 1px solid #618b74;
            padding: 28px 22px;
            box-shadow: 0 15px 20px -10px #0d1f1a;
        }
        /* 小屏幕适配 */
        @media screen and (max-width: 1100px) {
            .double-col {
                flex-direction: column;
            }
            .left-panel, .right-panel {
                min-width: auto;
                width: 100%;
            }
            h1 {
                font-size: 2.2rem;
            }
        }
        @media screen and (max-width: 600px) {
            body { padding: 15px 10px; }
            .left-panel, .right-panel { padding: 20px 15px; border-radius: 40px; }
            .preview-grid { gap: 8px; padding: 15px; }
            .preview-row { gap: 8px; }
            .preview-level-badge { min-width: 45px; font-size: 1rem; }
            .preview-icon { width: 55px; }
            .preview-icon .mini-img { width: 40px; height: 40px; }
            .form-row { flex-direction: column; gap: 10px; }
            .btn-add { padding: 12px 20px; }
        }

        .left-panel h2, .right-panel h2 {
            color: #ffd98c;
            font-size: 2rem;
            margin-bottom: 20px;
            border-left: 8px solid #b98f4a;
            padding-left: 20px;
            word-break: break-word;
        }
        
        /* ========= 重新设计的装备图库：等级纵向，武器衣服镯指横向 ========= */
        .preview-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 35px;
            background: #244137;
            border-radius: 60px;
            padding: 25px 20px;
            border: 1px solid #608a73;
        }
        .preview-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1f3a30;
            border-radius: 50px;
            padding: 8px 15px;
            border: 1px solid #5e8e72;
        }
        .preview-level-badge {
            min-width: 60px;
            background: #3a604e;
            color: #fbeba7;
            border-radius: 40px;
            padding: 8px 0;
            font-weight: 700;
            font-size: 1.3rem;
            text-align: center;
            border: 1px solid #9ebe8e;
            box-shadow: inset 0 2px 5px #2b4d38;
        }
        .preview-icons-row {
            display: flex;
            flex: 1;
            gap: 15px;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .preview-icon {
            width: 75px;
            background: #2d4f3e;
            border-radius: 20px;
            border: 2px solid #5d8d72;
            padding: 6px 0 2px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.1s;
        }
        .preview-icon .mini-img {
            width: 52px;
            height: 52px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #345f46;
            border-radius: 14px;
            border: 1px solid #86b692;
        }
        .preview-icon .mini-label {
            font-size: 0.85rem;
            background: #1e3d2e;
            color: #eddba5;
            width: 100%;
            text-align: center;
            border-radius: 0 0 16px 16px;
            font-weight: 600;
            padding: 3px 0;
        }

        /* 录入表单 */
        .input-form {
            background: #1f3d33;
            border-radius: 50px;
            padding: 26px 24px;
            border: 1px solid #669479;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1 1 160px;
        }
        .form-group label {
            display: block;
            color: #d7ecbe;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            background: #2b5341;
            border: 1px solid #7fa386;
            border-radius: 40px;
            padding: 14px 18px;
            color: #fcf5da;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
        }
        .form-control:focus {
            border-color: #efc476;
            box-shadow: 0 0 0 2px #dcb05580;
        }
        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23f5e3b3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 18px;
        }
        .btn-add {
            background: #5f884a;
            border: none;
            border-radius: 60px;
            padding: 14px 36px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fef5cf;
            border: 1px solid #bde2a3;
            cursor: pointer;
            box-shadow: 0 7px 0 #35633e;
            transition: 0.1s;
            margin-top: 12px;
            width: 100%;
        }
        .btn-add:hover {
            background: #72a259;
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #35633e;
        }
        .btn-add:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #35633e;
        }
        .curr-list {
            margin-top: 25px;
            background: #1b3b2e;
            border-radius: 50px;
            padding: 18px 22px;
            border: 1px solid #5a8a70;
            color: #f2e6b6;
        }
        .curr-list h3 {
            font-size: 1.5rem;
            color: #f7cf89;
            margin-bottom: 10px;
        }
        .curr-items {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .missing-chip {
            background: #6d4b2c;
            border: 1px solid #f3ba6a;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            color: #ffefbe;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .remove-chip {
            background: none;
            border: none;
            color: #ffc285;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 5px;
        }

        /* 右侧卡片容器 滚动 */
        .server-cards {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-height: 800px;
            overflow-y: auto;
            padding-right: 8px;
        }
        .server-card {
            background: #25473b;
            border-radius: 48px;
            border: 1px solid #679b7d;
            padding: 22px 25px;
            box-shadow: 0 8px 0 #1b352b;
        }
        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4e8067;
            padding-bottom: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .server-name {
            font-size: 2rem;
            font-weight: 700;
            color: #fbdd9d;
            word-break: break-word;
        }
        .missing-badge {
            background: #b9523a;
            color: #fbeac3;
            border-radius: 40px;
            padding: 4px 18px;
            font-weight: 600;
            border: 1px solid #ffad6b;
            white-space: nowrap;
        }
        .level-row {
            margin-bottom: 16px;
        }
        .level-title {
            background: #35644c;
            display: inline-block;
            padding: 4px 22px;
            border-radius: 30px;
            color: #fdefbc;
            font-weight: 700;
            margin-bottom: 10px;
            border: 1px solid #9fc692;
        }
        .equip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding-left: 10px;
        }
        .equip-item {
            width: 85px;
            background: #2e5540;
            border-radius: 20px;
            border: 2px solid #619573;
            padding: 6px 0 4px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.1s;
        }
        .equip-item.missing {
            border-color: #d7943a;
            background: #654728;
            box-shadow: 0 0 0 2px #efc158;
            cursor: pointer;
        }
        .equip-img {
            width: 56px;
            height: 56px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #366046;
            border-radius: 16px;
            border: 1px solid #8ebb93;
        }
        .equip-label {
            width: 100%;
            text-align: center;
            background: #17412e;
            color: #f6eac2;
            font-size: 0.85rem;
            padding: 3px 0;
            border-radius: 0 0 16px 16px;
        }
        .missing .equip-label {
            background: #a8682b;
            color: #211500;
        }
        .empty-note {
            color: #afcaad;
            text-align: center;
            padding: 40px;
            font-size: 1.3rem;
        }
        .footer-note {
            margin-top: 30px;
            color: #689177;
            text-align: center;
        }
        /* footer区域 */
        .footer-wrapper {
            width: 100%;
            margin-top: 40px;
            background: #1a2f28;
            border-radius: 60px 60px 0 0;
            padding: 30px 20px 20px;
            border-top: 2px solid #5d8771;
            color: #bdd0b0;
            text-align: center;
        }
        #footer-container {
            max-width: 1200px;
            margin: 0 auto;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💎 钻石回收 · 等级纵列版</h1>
    <div class="sub">
        <span>武器·衣服·镯·指 43~49级 (全PNG)</span>
        <span>左侧添加缺失 · 右侧实时展示</span>
    </div>

    <div class="double-col">
        <!-- ========= 左侧面板：重新设计的装备图库 + 录入 ========= -->
        <div class="left-panel">
            <h2>📋 装备图库 & 登记</h2>
            <!-- 等级纵向排列，每种等级右侧依次是武器、衣服、镯、指 -->
            <div class="preview-grid" id="previewGrid"></div>

            <!-- 录入表单 -->
            <div class="input-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>🗺️ 区服名称</label>
                        <input type="text" id="serverNameInput" class="form-control" placeholder="例如 131区·战神" value="131区·战神">
                    </div>
                    <div class="form-group">
                        <label>⚡ 等级</label>
                        <select id="levelSelect" class="form-control">
                            <option value="43">43级</option>
                            <option value="44">44级</option>
                            <option value="45">45级</option>
                            <option value="46">46级</option>
                            <option value="47">47级</option>
                            <option value="48">48级</option>
                            <option value="49">49级</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🛡️ 部位</label>
                        <select id="partSelect" class="form-control">
                            <option value="wq">武器 (wq)</option>
                            <option value="jia">衣服 (jia)</option>
                            <option value="zhuo">镯 (zhuo)</option>
                            <option value="zhi">指 (zhi)</option>
                        </select>
                    </div>
                </div>
                <button class="btn-add" id="addMissingBtn">➕ 添加缺失装备</button>
            </div>

            <!-- 当前缺失预览 (方便查看已选) -->
            <div class="curr-list">
                <h3>📌 当前已登记的缺失</h3>
                <div id="currentMissingList" class="curr-items">
                    <!-- 动态生成chip -->
                </div>
                <p style="margin-top: 15px; color: #b9d9b4; font-size:0.95rem;">⬇️ 点击右侧卡片里的红色装备可移除</p>
            </div>
        </div>

        <!-- ========= 右侧面板：区服缺失卡片 ========= -->
        <div class="right-panel">
            <h2>📦 区服缺失总览</h2>
            <div id="serverCardContainer" class="server-cards">
                <!-- 动态渲染所有区服卡片 -->
            </div>
        </div>
    </div>
    <div class="footer-note">
        ⚡ 所有装备图片均为PNG格式（包括衣服、镯、指）。左侧选择区服+等级+部位，点击添加；右侧点击红色装备可移除。
    </div>
</div>

<!-- Footer 区域 -->
<div class="footer-wrapper">
    <footer id="footer-container">加载中...</footer>
</div>

<!-- 所有JavaScript代码内联 -->
<script>
(function() {
    // ---------- 装备图片映射 (全部使用png) ----------
    const EQUIP_IMG_MAP = {
        "43": { "wq": "43_wq.png", "jia": "43_jia.png", "zhuo": "43_zhuo.png", "zhi": "43_zhi.png" },
        "44": { "wq": "44_wq.png", "jia": "44_jia.png", "zhuo": "44_zhuo.png", "zhi": "44_zhi.png" },
        "45": { "wq": "45_wq.png", "jia": "45_jia.png", "zhuo": "45_zhuo.png", "zhi": "45_zhi.png" },
        "46": { "wq": "46_wq.png", "jia": "46_jia.png", "zhuo": "46_zhuo.png", "zhi": "46_zhi.png" },
        "47": { "wq": "47_wq.png", "jia": "47_jia.png", "zhuo": "47_zhuo.png", "zhi": "47_zhi.png" },
        "48": { "wq": "48_wq.png", "jia": "48_jia.png", "zhuo": "48_zhuo.png", "zhi": "48_zhi.png" },
        "49": { "wq": "49_wq.png", "jia": "49_jia.png", "zhuo": "49_zhuo.png", "zhi": "49_zhi.png" }
    };

    // 默认初始数据：包含131区缺失示例 (43镯,45衣,46武,49衣)
    let serverData = [
        { 
            server: "131区·战神", 
            missing: ["43_zhuo", "45_jia", "46_wq", "49_jia"]
        }
    ];

    // 等级和部位常量
    const LEVELS = [43,44,45,46,47,48,49];
    const TYPES = [
        { key: 'wq', label: '武' },
        { key: 'jia', label: '衣' },
        { key: 'zhuo', label: '镯' },
        { key: 'zhi', label: '指' }
    ];

    // ---------- 渲染左侧预览图 (等级纵向，武器衣服镯指横向) ----------
    function renderPreviewGrid() {
        const grid = document.getElementById('previewGrid');
        if (!grid) return;
        grid.innerHTML = '';
        
        LEVELS.forEach(level => {
            const levelStr = level.toString();
            const levelData = EQUIP_IMG_MAP[levelStr];
            if (!levelData) return;

            // 创建一行
            const row = document.createElement('div');
            row.className = 'preview-row';

            // 等级徽章
            const badge = document.createElement('div');
            badge.className = 'preview-level-badge';
            badge.textContent = level;
            row.appendChild(badge);

            // 四个图标的行
            const iconsRow = document.createElement('div');
            iconsRow.className = 'preview-icons-row';

            TYPES.forEach(type => {
                const imgFile = levelData[type.key] || '';
                const item = document.createElement('div');
                item.className = 'preview-icon';

                const imgDiv = document.createElement('div');
                imgDiv.className = 'mini-img';
                if (imgFile) imgDiv.style.backgroundImage = `url('${imgFile}')`;

                const label = document.createElement('div');
                label.className = 'mini-label';
                label.textContent = type.label;

                item.appendChild(imgDiv);
                item.appendChild(label);
                iconsRow.appendChild(item);
            });

            row.appendChild(iconsRow);
            grid.appendChild(row);
        });
    }

    // ---------- 根据serverData渲染右侧所有区服卡片 ----------
    function renderRightCards() {
        const container = document.getElementById('serverCardContainer');
        if (!container) return;
        container.innerHTML = '';

        if (!serverData.length) {
            container.innerHTML = '<div class="empty-note">✨ 暂无区服数据，请添加</div>';
            return;
        }

        serverData.forEach((section, sIndex) => {
            const serverName = section.server || '未命名';
            const missingSet = new Set(section.missing || []);

            const card = document.createElement('div');
            card.className = 'server-card';

            // header
            const header = document.createElement('div');
            header.className = 'server-header';
            header.innerHTML = `
                <span class="server-name">${serverName}</span>
                <span class="missing-badge">缺失 ${missingSet.size}</span>
            `;
            card.appendChild(header);

            // 等级循环
            LEVELS.forEach(level => {
                const levelStr = level.toString();
                const levelData = EQUIP_IMG_MAP[levelStr];
                if (!levelData) return;

                const levelDiv = document.createElement('div');
                levelDiv.className = 'level-row';

                const levelTitle = document.createElement('div');
                levelTitle.className = 'level-title';
                levelTitle.textContent = level + '级';
                levelDiv.appendChild(levelTitle);

                const equipGroup = document.createElement('div');
                equipGroup.className = 'equip-group';

                TYPES.forEach(type => {
                    const equipKey = `${level}_${type.key}`;
                    const isMissing = missingSet.has(equipKey);
                    const imgFile = levelData[type.key] || '';

                    const equipItem = document.createElement('div');
                    equipItem.className = `equip-item ${isMissing ? 'missing' : ''}`;
                    equipItem.dataset.serverIndex = sIndex;
                    equipItem.dataset.equipKey = equipKey;

                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'equip-img';
                    if (imgFile) imgDiv.style.backgroundImage = `url('${imgFile}')`;

                    const labelSpan = document.createElement('div');
                    labelSpan.className = 'equip-label';
                    labelSpan.textContent = type.label;

                    equipItem.appendChild(imgDiv);
                    equipItem.appendChild(labelSpan);
                    equipItem.title = `${level}级 ${type.label} (${equipKey}) ${isMissing ? '❌点击移除缺失' : '✅拥有'}`;

                    // 只有缺失的装备才绑定点击移除事件
                    if (isMissing) {
                        equipItem.style.cursor = 'pointer';
                        equipItem.addEventListener('click', (e) => {
                            e.stopPropagation();
                            removeMissingItem(sIndex, equipKey);
                        });
                    }

                    equipGroup.appendChild(equipItem);
                });

                levelDiv.appendChild(equipGroup);
                card.appendChild(levelDiv);
            });

            container.appendChild(card);
        });
    }

    // ---------- 移除某个缺失项 ----------
    function removeMissingItem(serverIdx, equipKey) {
        if (!serverData[serverIdx]) return;
        let missingArr = serverData[serverIdx].missing;
        const index = missingArr.indexOf(equipKey);
        if (index !== -1) {
            missingArr.splice(index, 1);
            // 重新渲染右侧和当前列表
            renderRightCards();
            renderCurrentMissingChips();
        }
    }

    // ---------- 渲染左下角的“当前已登记的缺失”chips ----------
    function renderCurrentMissingChips() {
        const container = document.getElementById('currentMissingList');
        if (!container) return;
        container.innerHTML = '';
        let total = 0;
        serverData.forEach((section, sIdx) => {
            section.missing.forEach(key => {
                total++;
                const chip = document.createElement('span');
                chip.className = 'missing-chip';
                chip.innerHTML = `${section.server} <strong>${key}</strong> <button class="remove-chip" data-server-idx="${sIdx}" data-equip-key="${key}">✕</button>`;
                container.appendChild(chip);
            });
        });
        if (total === 0) {
            container.innerHTML = '<span style="color:#aac9b2;">暂无缺失记录，请添加</span>';
        }

        // 绑定移除按钮
        document.querySelectorAll('.remove-chip').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const serverIdx = btn.dataset.serverIdx;
                const equipKey = btn.dataset.equipKey;
                if (serverIdx !== undefined && equipKey) {
                    removeMissingItem(parseInt(serverIdx), equipKey);
                }
            });
        });
    }

    // ---------- 添加缺失逻辑 ----------
    function addMissing() {
        const serverName = document.getElementById('serverNameInput').value.trim();
        if (!serverName) {
            alert('请输入区服名称');
            return;
        }
        const level = document.getElementById('levelSelect').value;
        const part = document.getElementById('partSelect').value;
        const equipKey = `${level}_${part}`;

        // 查找是否存在该区服
        let serverIndex = serverData.findIndex(s => s.server === serverName);
        if (serverIndex === -1) {
            // 新区服
            serverData.push({ server: serverName, missing: [equipKey] });
        } else {
            // 已有区服，检查是否已经存在该缺失
            if (serverData[serverIndex].missing.includes(equipKey)) {
                alert('该装备已在此区服缺失列表中');
                return;
            }
            serverData[serverIndex].missing.push(equipKey);
        }

        // 重新渲染右侧及当前列表
        renderRightCards();
        renderCurrentMissingChips();
    }

    // ---------- 模拟footer加载 ----------
    function initFooter() {
        const footerEl = document.getElementById('footer-container');
        if (footerEl) {
            footerEl.innerHTML = '© 钻石回收管理系统 · 等级纵列版 · 所有装备图片均为PNG';
        }
    }

    // ---------- 绑定事件&初始化 ----------
    document.addEventListener('DOMContentLoaded', function() {
        renderPreviewGrid();
        renderRightCards();
        renderCurrentMissingChips();
        initFooter();

        // 绑定添加按钮
        document.getElementById('addMissingBtn').addEventListener('click', addMissing);
        // 输入框支持回车添加
        document.getElementById('serverNameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addMissing();
        });
    });

})();
</script>
</body>
</html>
