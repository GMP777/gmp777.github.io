<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钻石回收 · 双JSON装备缺失表</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1c2a28;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1400px;
            width: 100%;
        }
        h1 {
            color: #f3cd81;
            text-shadow: 0 3px 0 #7b5e37;
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .sub {
            color: #b6cfb4;
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .sub span {
            background: #2b453e;
            padding: 5px 25px;
            border-radius: 40px;
            border: 1px solid #759c83;
        }

        /* 两个json卡片区域 */
        .json-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 35px;
        }
        .json-card {
            flex: 1 1 300px;
            background: #1d3530;
            border-radius: 40px;
            border: 1px solid #6c8e78;
            padding: 20px 25px;
            box-shadow: 0 8px 0 #0e2620;
        }
        .json-card h3 {
            color: #ffe1a3;
            font-size: 1.5rem;
            margin-bottom: 10px;
            border-left: 8px solid #c9a455;
            padding-left: 16px;
        }
        .json-card textarea {
            width: 100%;
            background: #253b34;
            border: 1px solid #a6c7a3;
            color: #f5f0cf;
            padding: 16px;
            border-radius: 28px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
        }
        .json-card textarea:focus {
            border-color: #f3b35e;
            outline: none;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background: #426454;
            border: none;
            border-radius: 40px;
            padding: 12px 22px;
            font-weight: 700;
            color: #fbefc7;
            border: 1px solid #97ba8c;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 5px 0 #1f3a30;
            font-size: 1rem;
        }
        .btn-warning {
            background: #8f623b;
            border-color: #ebbc7e;
        }
        .btn:hover {
            background: #588065;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #1f3a30;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1f3a30;
        }

        /* 区服网格 */
        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 25px;
            margin: 35px 0;
        }
        .server-card {
            background: #213a33;
            border: 1px solid #5f8873;
            border-radius: 38px;
            padding: 22px 18px 18px 18px;
            box-shadow: 0 15px 15px -6px #0f1e19;
            transition: 0.15s;
        }
        .server-card:hover {
            border-color: #cbae6b;
        }
        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #436e5a;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }
        .server-name {
            font-size: 2rem;
            font-weight: 700;
            color: #fbdd9d;
            text-shadow: 0 2px 0 #5a401d;
        }
        .missing-count {
            background: #bb4c4c;
            color: #fff0c8;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: 600;
            border: 1px solid #ffb271;
        }
        .level-section {
            margin-bottom: 22px;
        }
        .level-title {
            background: #315a48;
            display: inline-block;
            padding: 4px 20px;
            border-radius: 30px;
            color: #ffebbc;
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 10px;
            border: 1px solid #98bb82;
        }
        .equip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-start;
            padding-left: 8px;
        }
        .equip-item {
            width: 90px;
            background: #2d4a3d;
            border-radius: 20px;
            border: 2px solid #598067;
            padding: 8px 0 4px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 0 #1f352b;
        }
        .equip-item.missing {
            border-color: #d7943a;
            background: #5a422b;
            box-shadow: 0 0 0 2px #f5bd62, 0 5px 0 #6d471b;
        }
        .equip-img {
            width: 64px;
            height: 64px;
            background-color: #385d48;
            border-radius: 16px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid #89b692;
            margin-bottom: 5px;
        }
        .equip-label {
            width: 100%;
            text-align: center;
            background: #1b3a2c;
            color: #f7eac5;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 3px 0;
            border-radius: 0 0 16px 16px;
        }
        .missing .equip-label {
            background: #a8682b;
            color: #281e0b;
        }
        .footer-note {
            color: #779e84;
            text-align: center;
            border-top: 1px dashed #4f7663;
            padding-top: 25px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💎 钻石回收 · 双JSON配置</h1>
    <div class="sub">
        <span>每件装备可回收2次</span>
        <span>武器·衣服·镯·指 43~49级</span>
    </div>

    <!-- 双JSON编辑区: 装备库JSON 和 区服缺失JSON -->
    <div class="json-panel">
        <!-- 装备图片映射JSON -->
        <div class="json-card">
            <h3>📦 装备库JSON (图片映射)</h3>
            <textarea id="equipJsonInput" rows="6">{
  "43": { "wq": "43_wq.png", "jia": "43_jia.php", "zhuo": "43_zhuo.php", "zhi": "43_zhi.php" },
  "44": { "wq": "44_wq.png", "jia": "44_jia.php", "zhuo": "44_zhuo.php", "zhi": "44_zhi.php" },
  "45": { "wq": "45_wq.png", "jia": "45_jia.php", "zhuo": "45_zhuo.php", "zhi": "45_zhi.php" },
  "46": { "wq": "46_wq.png", "jia": "46_jia.php", "zhuo": "46_zhuo.php", "zhi": "46_zhi.php" },
  "47": { "wq": "47_wq.png", "jia": "47_jia.php", "zhuo": "47_zhuo.php", "zhi": "47_zhi.php" },
  "48": { "wq": "48_wq.png", "jia": "48_jia.php", "zhuo": "48_zhuo.php", "zhi": "48_zhi.php" },
  "49": { "wq": "49_wq.png", "jia": "49_jia.php", "zhuo": "49_zhuo.php", "zhi": "49_zhi.php" }
}</textarea>
            <div class="btn-group">
                <button class="btn" id="applyEquipJson">📥 应用装备库</button>
                <button class="btn btn-warning" id="resetEquipJson">↩️ 重置默认</button>
            </div>
        </div>

        <!-- 区服缺失JSON -->
        <div class="json-card">
            <h3>📋 区服缺失JSON (xx区缺xx)</h3>
            <textarea id="serverMissJsonInput" rows="6">{
  "sections": [
    { "server": "S1·龙吟", "missing": ["44_wq", "46_jia", "47_zhuo", "48_zhi", "43_zhi", "49_jia"] },
    { "server": "S2·虎啸", "missing": ["43_wq", "43_jia", "44_zhuo", "45_zhi", "47_wq", "48_jia", "49_zhuo"] },
    { "server": "S3·凤凰", "missing": ["45_wq", "45_jia", "46_zhuo", "46_zhi", "48_zhuo", "49_zhi", "43_zhuo"] },
    { "server": "S5·麒麟", "missing": ["44_jia", "45_zhuo", "47_zhi", "48_wq", "49_jia"] }
  ]
}</textarea>
            <div class="btn-group">
                <button class="btn" id="applyServerJson">📥 应用区服缺失</button>
                <button class="btn btn-warning" id="resetServerJson">↩️ 重置默认</button>
            </div>
        </div>
    </div>

    <!-- 渲染出的区服卡片 -->
    <div id="serverGrid" class="server-grid"></div>

    <!-- 全局应用按钮 (同时应用两个JSON) -->
    <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 20px;">
        <button class="btn" id="applyBothBtn" style="background: #74653b; padding: 16px 40px; font-size: 1.3rem;">⚡ 同时应用双JSON并刷新 ⚡</button>
    </div>

    <div class="footer-note">
        ⚙️ 装备库JSON定义每个等级四个部件的图片文件名。<br>
        🧩 区服缺失JSON使用 "43_wq" 这样的key来标记缺失。<br>
        🖼️ 图片需放在相同目录下 (或调整路径)。
    </div>
</div>

<script>
(function() {
    // ---------- 默认装备库JSON (和textarea初始一致) ----------
    const DEFAULT_EQUIP_JSON = {
        "43": { "wq": "43_wq.png", "jia": "43_jia.php", "zhuo": "43_zhuo.php", "zhi": "43_zhi.php" },
        "44": { "wq": "44_wq.png", "jia": "44_jia.php", "zhuo": "44_zhuo.php", "zhi": "44_zhi.php" },
        "45": { "wq": "45_wq.png", "jia": "45_jia.php", "zhuo": "45_zhuo.php", "zhi": "45_zhi.php" },
        "46": { "wq": "46_wq.png", "jia": "46_jia.php", "zhuo": "46_zhuo.php", "zhi": "46_zhi.php" },
        "47": { "wq": "47_wq.png", "jia": "47_jia.php", "zhuo": "47_zhuo.php", "zhi": "47_zhi.php" },
        "48": { "wq": "48_wq.png", "jia": "48_jia.php", "zhuo": "48_zhuo.php", "zhi": "48_zhi.php" },
        "49": { "wq": "49_wq.png", "jia": "49_jia.php", "zhuo": "49_zhuo.php", "zhi": "49_zhi.php" }
    };

    // 默认区服缺失JSON
    const DEFAULT_SERVER_JSON = {
        "sections": [
            { "server": "S1·龙吟", "missing": ["44_wq", "46_jia", "47_zhuo", "48_zhi", "43_zhi", "49_jia"] },
            { "server": "S2·虎啸", "missing": ["43_wq", "43_jia", "44_zhuo", "45_zhi", "47_wq", "48_jia", "49_zhuo"] },
            { "server": "S3·凤凰", "missing": ["45_wq", "45_jia", "46_zhuo", "46_zhi", "48_zhuo", "49_zhi", "43_zhuo"] },
            { "server": "S5·麒麟", "missing": ["44_jia", "45_zhuo", "47_zhi", "48_wq", "49_jia"] }
        ]
    };

    // 当前活跃数据
    let equipMap = JSON.parse(JSON.stringify(DEFAULT_EQUIP_JSON));   // 格式 { "43": { "wq":"...", "jia":"...", ... } }
    let serverSections = JSON.parse(JSON.stringify(DEFAULT_SERVER_JSON.sections));

    // 等级列表 & 类型
    const LEVELS = [43,44,45,46,47,48,49];
    const TYPES = [
        { key: 'wq', label: '武' },
        { key: 'jia', label: '衣' },
        { key: 'zhuo', label: '镯' },
        { key: 'zhi', label: '指' }
    ];

    // ---------- 渲染函数 (使用equipMap 和 serverSections) ----------
    function renderServerGrid() {
        const grid = document.getElementById('serverGrid');
        grid.innerHTML = '';

        serverSections.forEach(section => {
            const serverName = section.server || '未知区服';
            const missingSet = new Set(section.missing || []);

            const card = document.createElement('div');
            card.className = 'server-card';

            // header
            const header = document.createElement('div');
            header.className = 'server-header';
            header.innerHTML = `
                <span class="server-name">${serverName}</span>
                <span class="missing-count">缺失 ${missingSet.size}</span>
            `;
            card.appendChild(header);

            // 按等级循环
            LEVELS.forEach(level => {
                const levelStr = level.toString();
                const levelData = equipMap[levelStr];
                if (!levelData) return; // 如果装备库没有该等级，跳过（但默认都有）

                const levelDiv = document.createElement('div');
                levelDiv.className = 'level-section';

                const levelTitle = document.createElement('div');
                levelTitle.className = 'level-title';
                levelTitle.textContent = level + '级';
                levelDiv.appendChild(levelTitle);

                const equipRow = document.createElement('div');
                equipRow.className = 'equip-row';

                // 遍历四个部件
                TYPES.forEach(type => {
                    const equipKey = `${level}_${type.key}`;
                    const isMissing = missingSet.has(equipKey);
                    const imgFile = levelData[type.key] || '';  // 从装备库取文件名

                    const itemDiv = document.createElement('div');
                    itemDiv.className = `equip-item ${isMissing ? 'missing' : ''}`;

                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'equip-img';
                    if (imgFile) {
                        imgDiv.style.backgroundImage = `url('${imgFile}')`;
                    } else {
                        imgDiv.style.backgroundColor = '#3d2f1f';
                    }
                    imgDiv.style.backgroundSize = 'contain';

                    const labelSpan = document.createElement('span');
                    labelSpan.className = 'equip-label';
                    labelSpan.textContent = type.label;

                    itemDiv.appendChild(imgDiv);
                    itemDiv.appendChild(labelSpan);
                    itemDiv.title = `${level}级 ${type.label} (${equipKey}) ${isMissing ? '❌缺失' : '✅存在'}`;

                    equipRow.appendChild(itemDiv);
                });

                levelDiv.appendChild(equipRow);
                card.appendChild(levelDiv);
            });

            grid.appendChild(card);
        });
    }

    // ---------- 同步textarea内容 (分别显示当前JSON) ----------
    function updateTextareas() {
        // 装备库JSON
        document.getElementById('equipJsonInput').value = JSON.stringify(equipMap, null, 2);
        // 区服缺失JSON
        const serverJsonObj = { sections: serverSections };
        document.getElementById('serverMissJsonInput').value = JSON.stringify(serverJsonObj, null, 2);
    }

    // ---------- 从装备库textarea解析并应用 ----------
    function applyEquipJsonFromTextarea() {
        const raw = document.getElementById('equipJsonInput').value.trim();
        if (!raw) { alert('装备库JSON不能为空'); return; }
        try {
            const parsed = JSON.parse(raw);
            // 简单校验结构: 需要包含43~49每个等级的对象, 且每个等级有wq,jia,zhuo,zhi (不强求)
            // 只要解析成功就覆盖
            equipMap = parsed;
            renderServerGrid();
            // 保持区服json不变, 但刷新textarea里的装备库为格式化后内容 (可选)
            document.getElementById('equipJsonInput').value = JSON.stringify(equipMap, null, 2);
        } catch (e) {
            alert('解析装备库JSON失败: ' + e.message);
        }
    }

    // 重置装备库
    function resetEquipJson() {
        equipMap = JSON.parse(JSON.stringify(DEFAULT_EQUIP_JSON));
        document.getElementById('equipJsonInput').value = JSON.stringify(equipMap, null, 2);
        renderServerGrid();
    }

    // ---------- 从区服缺失textarea解析并应用 ----------
    function applyServerJsonFromTextarea() {
        const raw = document.getElementById('serverMissJsonInput').value.trim();
        if (!raw) { alert('区服缺失JSON不能为空'); return; }
        try {
            const parsed = JSON.parse(raw);
            if (!parsed.sections || !Array.isArray(parsed.sections)) {
                alert('区服JSON须包含 "sections" 数组');
                return;
            }
            // 简单清洗：确保每个item有server和missing数组
            parsed.sections.forEach((item, idx) => {
                if (!item.server) item.server = `区服${idx+1}`;
                if (!Array.isArray(item.missing)) item.missing = [];
            });
            serverSections = parsed.sections;
            renderServerGrid();
            // 刷新textarea显示
            document.getElementById('serverMissJsonInput').value = JSON.stringify({ sections: serverSections }, null, 2);
        } catch (e) {
            alert('解析区服JSON失败: ' + e.message);
        }
    }

    function resetServerJson() {
        serverSections = JSON.parse(JSON.stringify(DEFAULT_SERVER_JSON.sections));
        document.getElementById('serverMissJsonInput').value = JSON.stringify({ sections: serverSections }, null, 2);
        renderServerGrid();
    }

    // 同时应用两个JSON (从textarea读)
    function applyBothJson() {
        // 先应用装备库 (可能会抛异常)
        try {
            const equipRaw = document.getElementById('equipJsonInput').value.trim();
            if (equipRaw) {
                const equipParsed = JSON.parse(equipRaw);
                equipMap = equipParsed;
            } else {
                alert('装备库JSON为空，保留原数据');
            }
        } catch (e) {
            alert('装备库JSON格式错误，请修正后再同时应用。');
            return;
        }

        try {
            const serverRaw = document.getElementById('serverMissJsonInput').value.trim();
            if (serverRaw) {
                const serverParsed = JSON.parse(serverRaw);
                if (!serverParsed.sections || !Array.isArray(serverParsed.sections)) {
                    alert('区服JSON缺少sections数组');
                    return;
                }
                serverParsed.sections.forEach(item => {
                    if (!item.server) item.server = '未命名';
                    if (!Array.isArray(item.missing)) item.missing = [];
                });
                serverSections = serverParsed.sections;
            } else {
                alert('区服JSON为空，保留原数据');
            }
        } catch (e) {
            alert('区服JSON格式错误：' + e.message);
            return;
        }

        // 重新渲染 + 更新textarea显示
        renderServerGrid();
        document.getElementById('equipJsonInput').value = JSON.stringify(equipMap, null, 2);
        document.getElementById('serverMissJsonInput').value = JSON.stringify({ sections: serverSections }, null, 2);
    }

    // ---------- 初始化 ----------
    function init() {
        // 填充textarea默认值
        document.getElementById('equipJsonInput').value = JSON.stringify(DEFAULT_EQUIP_JSON, null, 2);
        document.getElementById('serverMissJsonInput').value = JSON.stringify(DEFAULT_SERVER_JSON, null, 2);
        // 初始渲染
        renderServerGrid();

        // 绑定事件
        document.getElementById('applyEquipJson').addEventListener('click', applyEquipJsonFromTextarea);
        document.getElementById('resetEquipJson').addEventListener('click', resetEquipJson);
        document.getElementById('applyServerJson').addEventListener('click', applyServerJsonFromTextarea);
        document.getElementById('resetServerJson').addEventListener('click', resetServerJson);
        document.getElementById('applyBothBtn').addEventListener('click', applyBothJson);
    }

    init();
})();
</script>
</body>
</html>
